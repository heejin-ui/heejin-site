        var files = Array.prototype.slice.call(el.querySelector('.pv-files').files);

        var salt = crypto.getRandomValues(new Uint8Array(16)), saltB64 = bytesToB64(salt), iter = 310000;
        deriveKey(p1, salt, iter).then(function (k) {
          key = k;

    function bindTasks(root) {

        cb.addEventListener('change', function () {
          var k = +cb.getAttribute('data-line'), lines = body.split('\n'), m = lines[k] && lines[k].match(TASK_RE);
          if (!m) return;
          lines[k] = m[1] + (cb.checked ? '[x]' : '[ ]') + m[3] + m[4];

    var countTasks = function () {};

    function headingLines() {
      var out = [], fence = false;
      body.split('\n').forEach(function (l, k) { if (/^```/.test(l)) fence = !fence; if (!fence && /^#\s+/.test(l)) out.push(k); });
      return out;
    }
    function addTask(text) {
      var lines = body.split('\n'), heads = headingLines(), at = lines.length;
      if (heads.length) {
        var cur = 0; try { cur = parseInt(sessionStorage.getItem('hj-sub-' + pkey), 10) || 0; } catch (e) {}

        at = cur + 1 < heads.length ? heads[cur + 1] : lines.length;
      }
      while (at > 0 && !lines[at - 1].trim() && (heads.indexOf(at - 1) < 0)) at--;
      lines.splice(at, 0, '- [ ] ' + text);
      body = lines.join('\n'); render(); scheduleSave();

    function renderPlanner(host, mode) {
      var data = { events: [] };

      data.events.forEach(function (e) { if (!e.kind) e.kind = 'event'; });
      function save() { body = JSON.stringify(data, null, 1); scheduleSave(); }
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      var ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
      var WD = ['일', '월', '화', '수', '목', '금', '토'];
      var today = ymd(new Date());
      var sel = today; try { sel = sessionStorage.getItem('hj-plan-sel') || today; } catch (e) {}
      var view = new Date(sel + 'T00:00:00'); view.setDate(1);

      function nice(d) { var x = new Date(d + 'T00:00:00'); return (x.getMonth() + 1) + '월 ' + x.getDate() + '일 (' + WD[x.getDay()] + ')'; }
      function shift(d, n) { var x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return ymd(x); }
      function on(day, kind) {

          dates = d + 'T' + t + '/' + ymd(end).replace(/-/g, '') + 'T' + pad(end.getHours()) + pad(end.getMinutes()) + '00';
        } else dates = d + '/' + shift(e.date, 1).replace(/-/g, '');

      function prepSemTasks(src) {

    }).catch(function () {});

  function parseNav(yml) {
    var lines = yml.split('\n'), i = 0, start = -1, end = -1, ind = '', items = [];
    for (; i < lines.length; i++) {
      var m = lines[i].match(/^(\s*)left:\s*$/);
      if (m && i > 0 && /navbar:/.test(lines.slice(Math.max(0, i - 3), i).join('\n'))) { start = i; ind = m[1]; break; }
    }
    if (start < 0) return null;
    for (i = start + 1; i < lines.length; i++) {
      var l = lines[i];
      if (l.trim() && l.match(/^(\s*)/)[1].length <= ind.length) break;
      var h = l.match(/^\s*-\s*href:\s*(.+?)\s*$/), t = l.match(/^\s*text:\s*(.+?)\s*$/);
      if (h) items.push({ href: h[1].replace(/^["']|["']$/g, ''), text: '' });
      else if (t && items.length) items[items.length - 1].text = t[1].replace(/^"(.*)"$/, '$1').replace(/\\"/g, '"');
    }
    end = i;
    return { lines: lines, start: start, end: end, ind: ind, items: items };
  }
  function buildNav(p, items) {
    var a = p.ind + '  ', b = p.ind + '    ';
    var block = items.map(function (it) {
      return a + '- href: ' + it.href + '\n' + b + 'text: "' + it.text.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    });
    return p.lines.slice(0, p.start + 1).concat(block, p.lines.slice(p.end)).join('\n');
  }
  function slugify(name) {
    return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  }

      else status.textContent = doing + ' 못했어요 (' + e.message + '). 잠시 뒤 다시 해 주세요.';

    function load() {
      if (!get(TOKEN)) return showSetup();
      $('.tb-main').hidden = false; status.textContent = '불러오는 중…';
      Promise.all([ghGet('_quarto.yml'), ghGet(PDIR + 'tabs.json')]).then(function (r) {
        st.nav = parseNav(r[0].text);
        if (!st.nav) throw new Error('메뉴를 찾지 못함');
        st.pub = st.nav.items.map(function (x) { return { href: x.href, text: x.text }; });
        st.priv = r[1] ? JSON.parse(r[1].text) : privateTabs().map(function (t) { var o = { key: t.key, name: t.name }; if (t.type) o.type = t.type; return o; });
        st.origPub = JSON.stringify(st.pub); st.origPriv = JSON.stringify(st.priv);

      }).catch(function (e) { btn.disabled = false; fail(e, '저장하지'); });

  }

  function themeCss(t) {

      '/* Setting 탭에서 만든 파일이에요. 직접 고치지 말고 홈페이지 Setting 탭에서 바꿔 주세요. */\n' +

            const lastEl = window.document.getElementById(lineIds[lineIds.length - 1]);
            const parent = el.parentElement.parentElement;
            // cook up a div (if necessary) and position it
            let div = window.document.getElementById("code-annotation-line-highlight");
            if (div === null) {
              div = window.document.createElement("div");
              div.setAttribute("id", "code-annotation-line-highlight");
              div.style.position = 'absolute';
              parent.appendChild(div);
            }
            placeBand(div, el, lastEl, parent.closest("div.sourceCode") || parent);
            let gutterDiv = window.document.getElementById("code-annotation-line-highlight-gutter");
            if (gutterDiv === null) {
              gutterDiv = window.document.createElement("div");
              gutterDiv.setAttribute("id", "code-annotation-line-highlight-gutter");
              gutterDiv.style.position = 'absolute';
              const codeCell = window.document.getElementById(targetCell);
              const gutter = codeCell.querySelector('.code-annotation-gutter');
              gutter.appendChild(gutterDiv);
            }
            placeBand(gutterDiv, el, lastEl);
            selectedAnnoteEl = annoteEl;
          }
        };
        const unselectCodeLines = () => {
          const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
          elementsIds.forEach((elId) => {
            const div = window.document.getElementById(elId);
            if (div) {
              div.remove();
            }
          });
          selectedAnnoteEl = undefined;
        };
          // Handle positioning of the toggle
      window.addEventListener(
        "resize",
        throttle(() => {
          elRect = undefined;
          if (selectedAnnoteEl) {
            selectCodeLines(selectedAnnoteEl);
          }
        }, 10)
      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
  </script>
