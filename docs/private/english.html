  function fmSet(fm, key, val, after) {
    var line = key + ': "' + val.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    var re = new RegExp('^' + key + ':.*$', 'm');
    if (re.test(fm)) return fm.replace(re, function () { return line; });
    if (!val) return fm;
    var ra = new RegExp('^' + after + ':.*$', 'm');
    return ra.test(fm) ? fm.replace(ra, function (x) { return x + '\n' + line; }) : fm + '\n' + line;
  }

  var TOKEN_HELP =
    '<ol><li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 만들기 화면 열기</a></li>' +
    '<li>Repository access에서 <b>Only select repositories</b> → <b>heejin-site</b>만 고르기</li>' +
    '<li>Permissions에서 <b>Contents</b>를 찾아 <b>Read and write</b>로</li>' +
    '<li>Generate token을 누르고 나온 글자를 복사해서 아래에 붙여 넣기</li></ol>';

  /* 편집 창. o.kind: 'qmd'(공개 글) 또는 'enc'(비공개 암호화 글) */
  function openEditor(o) {
    var old = document.getElementById('me-editor'); if (old) old.remove();
    var wrap = document.createElement('div'); wrap.id = 'me-editor';
    wrap.innerHTML =
      '<div class="ed-card">' +
        '<div class="ed-head"><strong>' + (o.kind === 'enc' ? '비공개 페이지 수정' : '페이지 수정') + '</strong><span class="ed-path">' + esc(o.label || '') + '</span>' +
        '<button class="ed-close" type="button">닫기</button></div>' +
        '<div class="ed-setup" hidden>' +
          '<p class="ed-setup-msg"><b>처음 한 번만</b> 깃허브 열쇠(토큰)를 넣어 주세요. 이 브라우저에만 저장돼요.</p>' + TOKEN_HELP +
          '<div class="ed-row"><input class="ed-token" type="password" placeholder="github_pat_로 시작하는 글자"><button class="ed-token-save" type="button">저장</button></div>' +
        '</div>' +
        '<div class="ed-main" hidden>' +
          (o.kind === 'qmd' ? '<div class="ed-fields"><label>제목 <input class="ed-title"></label><label>부제 <input class="ed-sub"></label></div>' : '') +
          '<div class="ed-tools">' +
            '<button type="button" data-t="h2">큰 소제목</button><button type="button" data-t="h3">작은 소제목</button>' +
            '<button type="button" data-t="b">굵게</button><button type="button" data-t="i">기울임</button>' +
            '<button type="button" data-t="ul">목록</button><button type="button" data-t="a">링크</button>' +
            '<button type="button" data-t="file">파일 불러오기</button><input type="file" class="ed-file" accept=".md,.txt,.qmd" hidden>' +
            '<span class="ed-tip">왼쪽에 쓰면 오른쪽에 바로 보여요</span></div>' +
          '<div class="ed-split"><textarea class="ed-text" spellcheck="false"></textarea><div class="ed-preview"></div></div>' +
          '<div class="ed-foot"><span class="ed-status"></span>' +
            (o.kind === 'enc' ? '<span class="ed-lock">비밀번호로 암호화해서 저장돼요</span>' : '') +
            '<button class="ed-forget" type="button">토큰 지우기</button>' +
            '<button class="ed-apply" type="button">적용</button></div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var $ = function (c) { return wrap.querySelector(c); };
    var ta = $('.ed-text'), pv = $('.ed-preview'), status = $('.ed-status');
    var state = { fm: null, dirty: false };

    function close() {
      if (state.dirty && !confirm('적용하지 않은 내용이 있어요. 그래도 닫을까요?')) return;
      wrap.remove();

    $('.ed-close').addEventListener('click', close);
    wrap.addEventListener('click', function (e) { if (e.target === wrap) close(); });

    function preview() { pv.innerHTML = (state.fm !== null && fmGet(state.fm, 'listing') !== null ? '<p class="ed-tip">이 페이지의 목록은 Notes 글에서 자동으로 만들어져요.</p>' : '') + md(ta.value); }
    function markDirty() { state.dirty = true; status.textContent = '아직 적용 안 했어요.'; preview(); }
    ta.addEventListener('input', markDirty);
    if (o.kind === 'qmd') { $('.ed-title').addEventListener('input', markDirty); $('.ed-sub').addEventListener('input', markDirty); }

    function wrapSel(a, b, ph) {
      var s0 = ta.selectionStart, s1 = ta.selectionEnd, sel = ta.value.slice(s0, s1) || ph;
      ta.setRangeText(a + sel + b, s0, s1, 'end'); ta.focus(); markDirty();
    }
    function prefixLine(pre) {
      var s0 = ta.selectionStart, st = ta.value.lastIndexOf('\n', s0 - 1) + 1;
      ta.setRangeText(pre, st, st, 'end'); ta.focus(); markDirty();
    }
    wrap.querySelectorAll('.ed-tools button').forEach(function (b) {
      b.addEventListener('click', function () {
        var t = b.getAttribute('data-t');
        if (t === 'h2') prefixLine('## ');
        else if (t === 'h3') prefixLine('### ');
        else if (t === 'b') wrapSel('**', '**', '굵게 쓸 말');
        else if (t === 'i') wrapSel('*', '*', '기울일 말');
        else if (t === 'ul') prefixLine('- ');
        else if (t === 'a') { var u = prompt('연결할 주소를 넣어 주세요', 'https://'); if (u) wrapSel('[', '](' + u + ')', '링크 글자'); }
        else if (t === 'file') $('.ed-file').click();

    });
    $('.ed-file').addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return;
      if (ta.value.trim() && !confirm('지금 쓴 내용을 파일 내용으로 바꿀까요?')) { e.target.value = ''; return; }
      f.text().then(function (t) { ta.value = splitFront(t.replace(/\r/g, '')).body; markDirty(); e.target.value = ''; });
    });

    function showSetup(msg) { $('.ed-setup').hidden = false; $('.ed-main').hidden = true; if (msg) $('.ed-setup-msg').innerHTML = msg; }
    $('.ed-token-save').addEventListener('click', function () {
      var v = $('.ed-token').value.trim(); if (!v) return;
      set(TOKEN, v); $('.ed-setup').hidden = true; load();
    });
    $('.ed-forget').addEventListener('click', function () {
      if (!confirm('이 브라우저에 저장된 토큰을 지울까요?')) return;
      del(TOKEN); showSetup();
    });
    function fail(e, doing) {
      if (e.message === 'auth') showSetup('<b>토큰이 맞지 않거나 기한이 지났어요.</b> 새로 만들어서 넣어 주세요.');
      else if (e.message === 'conflict') status.textContent = '그사이 다른 곳에서 이 파일이 바뀌었어요. 쓴 내용을 복사해 두고 다시 열어 주세요.';
      else status.textContent = doing + ' 못했어요 (' + e.message + '). 토큰에 heejin-site와 Contents 쓰기 권한이 있는지 확인해 주세요.';

    function load() {
      if (!get(TOKEN)) { showSetup(); return; }
      $('.ed-main').hidden = false;
      if (o.kind === 'enc') { ta.value = o.body || ''; state.dirty = false; status.textContent = ''; preview(); return; }
      status.textContent = '불러오는 중…';
      ghGet(o.path).then(function (f) {
        if (!f) throw new Error('파일 없음');
        var sp = splitFront(f.text); state.fm = sp.fm;
        $('.ed-title').value = fmGet(sp.fm, 'title') || '';

    $('.ed-apply').addEventListener('click', function () {
      if (!state.dirty) { status.textContent = '바뀐 게 없어요.'; return; }
      var body = ta.value.replace(/\s+$/, '') + '\n', job;

      } else {

        if (fm !== null) {
          fm = fmSet(fm, 'title', $('.ed-title').value.trim(), 'title');

          fm = fmSet(fm, subKey, $('.ed-sub').value.trim(), 'title');
        }
        job = ghPut(o.path, (fm !== null ? '---\n' + fm + '\n---\n\n' : '') + body, '홈페이지에서 수정: ' + o.path);

      job.then(function () {
        state.dirty = false; btn.disabled = false;
        if (o.kind === 'enc') { status.textContent = '적용했어요! 바로 반영됐어요.'; o.onSaved(body); }
        else { status.textContent = '적용했어요! 이 화면엔 바로 보이고, 홈페이지 전체에는 2~3분 뒤 반영돼요.'; showOnPage(); }
      }).catch(function (e) { btn.disabled = false; fail(e, '저장하지'); });

    function showOnPage() {
      var main = document.querySelector('main') || document.querySelector('#quarto-document-content');

      var h1 = document.querySelector('#title-block-header h1.title, h1.title');
      if (h1) h1.textContent = $('.ed-title').value;
      var sub = document.querySelector('#title-block-header .subtitle, p.subtitle');
      if (sub) sub.textContent = $('.ed-sub').value;
      if (document.querySelector('.quarto-listing')) return;
      var hdr = main.querySelector('#title-block-header');
      Array.prototype.slice.call(main.children).forEach(function (c) { if (c !== hdr) c.remove(); });
      var div = document.createElement('div'); div.innerHTML = md(ta.value); main.appendChild(div);
    }

    load();
  }

  /* 비공개 탭: 비밀번호로 열고, 같은 편집 창으로 고치기 */
  function privateInit(el, pkey, label, box) {
    var keyFile = null, key = null, body = '', btnAdded = false;
    var ALL = privateTabs().map(function (t) { return t.key; });

    function msg(html) { el.innerHTML = '<div class="pv-box">' + html + '</div>'; }
    function fail(e) {
      if (e.message === 'auth') { del(TOKEN); msg('<p>깃허브 토큰이 맞지 않거나 기한이 지났어요. 새로고침한 뒤 다시 넣어 주세요.</p>'); }
      else msg('<p>불러오지 못했어요 (' + esc(e.message) + '). 잠시 뒤 새로고침해 주세요.</p>');
    }
    function verify(k) {
      return decText(k, keyFile.check).then(function (t) { return t === 'heejin-ok'; }, function () { return false; });
    }

    function askPw(err) {
      msg('<p>이 페이지는 잠겨 있어요. 비공개 탭 비밀번호를 넣어 주세요.</p>' +
        '<div class="ed-row"><input type="password" class="pv-pw" placeholder="비밀번호"><button type="button" class="pv-open">열기</button></div>' +
        '<label class="pv-check"><input type="checkbox" class="pv-remember" checked> 이 기기에서 기억하기</label>' +
        '<p class="pv-err">' + (err || '') + '</p>');
      var pw = el.querySelector('.pv-pw'), go = el.querySelector('.pv-open');
      function submit() {
        if (!pw.value) return;
        go.disabled = true; el.querySelector('.pv-err').textContent = '여는 중…';
        deriveKey(pw.value, b64ToBytes(keyFile.salt), keyFile.iter).then(function (k) {
          return verify(k).then(function (ok) {
            if (!ok) return askPw('비밀번호가 맞지 않아요.');
            key = k;
            var keep = el.querySelector('.pv-remember').checked;
            return (keep ? cacheKey(k, keyFile.salt) : Promise.resolve()).then(showContent);
          });
        });
      }
      go.addEventListener('click', submit);
      pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
      pw.focus();
    }

    function tokenStep(next) {
      msg('<p><b>처음 한 번만</b> 깃허브 열쇠(토큰)를 넣어 주세요. 이 브라우저에만 저장돼요.</p>' + TOKEN_HELP +
        '<div class="ed-row"><input type="password" class="pv-token" placeholder="github_pat_로 시작하는 글자"><button type="button" class="pv-token-save">저장</button></div>');
      el.querySelector('.pv-token-save').addEventListener('click', function () {
        var v = el.querySelector('.pv-token').value.trim(); if (!v) return;
        set(TOKEN, v); next();
      });
    }

    function setupFlow() {
      if (!get(TOKEN)) return tokenStep(setupFlow);
      msg('<p><b>처음 설정</b> 비공개 탭에 쓸 비밀번호를 정해 주세요. 이 비밀번호를 잊으면 내용을 되살릴 수 없으니 꼭 따로 적어 두세요.</p>' +
        '<div class="pv-form"><input type="password" class="pv-pw1" placeholder="비밀번호 (8자 이상)">' +
        '<input type="password" class="pv-pw2" placeholder="한 번 더"></div>' +
        '<p>처음 내용 파일이 있으면 같이 골라 주세요. 여러 개를 한 번에 골라도 돼요. (선택)</p>' +
        '<input type="file" class="pv-files" accept=".md,.txt" multiple>' +
        '<p><button type="button" class="pv-setup">설정하기</button></p><p class="pv-err"></p>');
      el.querySelector('.pv-setup').addEventListener('click', function () {
        var p1 = el.querySelector('.pv-pw1').value, p2 = el.querySelector('.pv-pw2').value, err = el.querySelector('.pv-err');
        if (p1.length < 8) { err.textContent = '비밀번호는 8자 이상으로 정해 주세요.'; return; }
        if (p1 !== p2) { err.textContent = '두 비밀번호가 달라요.'; return; }
        var files = Array.prototype.slice.call(el.querySelector('.pv-files').files);
        this.disabled = true; err.textContent = '설정하는 중…';
        var salt = crypto.getRandomValues(new Uint8Array(16)), saltB64 = bytesToB64(salt), iter = 310000;
        deriveKey(p1, salt, iter).then(function (k) {
          key = k;
          return encText(k, 'heejin-ok');
        }).then(function (chk) {
          keyFile = { v: 1, salt: saltB64, iter: iter, check: chk };
          return ghPut(PDIR + 'key.json', JSON.stringify(keyFile, null, 2) + '\n', '비공개 탭 비밀번호 설정');
        }).then(function () {
          return files.reduce(function (pr, f) {
            var name = f.name.replace(/\.(md|txt)$/i, '').toLowerCase();
            if (ALL.indexOf(name) < 0) return pr;
            return pr.then(function () {
              err.textContent = name + ' 불러오는 중…';
              return f.text().then(function (t) { return encText(key, t.replace(/\r/g, '')); })
                .then(function (o) { return ghPut(PDIR + name + '.enc', JSON.stringify(o) + '\n', '비공개 탭 처음 내용: ' + name); });
            });
          }, Promise.resolve());
        }).then(function () { return cacheKey(key, saltB64); })
          .then(showContent)
          .catch(fail);
      });
    }

    function render() {
      el.innerHTML = body.trim() ? md(body) : '<p class="pv-empty">아직 내용이 없어요. 오른쪽 아래 "이 페이지 수정"을 눌러 써 보세요.</p>';
      var lock = document.createElement('p'); lock.className = 'pv-lockline';
      lock.innerHTML = '<a href="#">이 기기에서 잠그기</a>';
      lock.querySelector('a').addEventListener('click', function (e) { e.preventDefault(); del(PKEY); location.reload(); });
      el.appendChild(lock);
    }

    function showContent() {
      msg('<p>불러오는 중…</p>');
      return ghGet(PDIR + pkey + '.enc').then(function (f) {
        return f ? decText(key, JSON.parse(f.text)) : '';
      }).then(function (t) {
        body = t; render();
        if (btnAdded) return;
        btnAdded = true;
        var ed = document.createElement('a');
        ed.className = 'me-btn me-edit'; ed.href = '#'; ed.textContent = '이 페이지 수정';
        ed.addEventListener('click', function (e) {
          e.preventDefault();
          openEditor({
            kind: 'enc', label: label, body: body,
            save: function (newBody) {
              return encText(key, newBody).then(function (o) {
                return ghPut(PDIR + pkey + '.enc', JSON.stringify(o) + '\n', '비공개 탭 수정: ' + pkey);
              });
            },
            onSaved: function (newBody) { body = newBody; render(); }
          });
        });
        box.appendChild(ed);
      }).catch(function (e) {
        if (e && e.name === 'OperationError') { del(PKEY); askPw('저장된 열쇠가 맞지 않아요. 비밀번호를 다시 넣어 주세요.'); }
        else fail(e);
      });
    }

    msg('<p>불러오는 중…</p>');
    ghGet(PDIR + 'key.json').then(function (kf) {
      if (!kf) return setupFlow();
      keyFile = JSON.parse(kf.text);
      return cachedKey(keyFile.salt).then(function (k) {
        if (!k) return askPw();
        return verify(k).then(function (ok) {
          if (!ok) { del(PKEY); return askPw(); }
          key = k; return showContent();
        });
      });
    }).catch(fail);
  }

  /* ---------- 탭 관리 ---------- */
  function renderPrivateNav(list) {
    var nav = document.querySelector('.navbar .navbar-nav');
    if (!nav) return;
    nav.querySelectorAll('li.me-li').forEach(function (li) { li.remove(); });
    var cur = new URLSearchParams(location.search).get('k');
    list.forEach(function (t) {
      var li = document.createElement('li'); li.className = 'nav-item me-li';
      var a = document.createElement('a'); a.className = 'nav-link me-link' + (cur === t.key ? ' active' : '');
      a.href = ROOT + 'private/tab.html?k=' + encodeURIComponent(t.key);
      a.innerHTML = '<span class="menu-text">' + esc(t.name) + '</span>';
      li.appendChild(a); nav.appendChild(li);
    });
    var li = document.createElement('li'); li.className = 'nav-item me-li';
    var a = document.createElement('a'); a.className = 'nav-link me-link' + (/private\/settings\.html$/.test(location.pathname) ? ' active' : '');
    a.href = ROOT + 'private/settings.html'; a.innerHTML = '<span class="menu-text">Setting</span>';
    li.appendChild(a); nav.appendChild(li);
  }
  function refreshPrivateTabs() {
    ghGet(PDIR + 'tabs.json').then(function (f) {
      if (!f) return;
      var list = JSON.parse(f.text);
      if (JSON.stringify(list) !== JSON.stringify(privateTabs())) { set(TABS_CACHE, JSON.stringify(list)); renderPrivateNav(list); }
    }).catch(function () {});
  }

  function parseNav(yml) {
    var lines = yml.split('\n'), i = 0, start = -1, end = -1, ind = '', items = [];
    for (; i < lines.length; i++) {
      var m = lines[i].match(/^(\s*)left:\s*$/);
      if (m && i > 0 && /navbar:/.test(lines.slice(Math.max(0, i - 3), i).join('\n'))) { start = i; ind = m[1]; break; }
    }
    if (start < 0) return null;
    for (i = start + 1; i < lines.length; i++) {
      var l = lines[i];
      if (l.trim() && l.match(/^(\s*)/)[1].length <= ind.length) break;
      var h = l.match(/^\s*-\s*href:\s*(.+?)\s*$/), t = l.match(/^\s*text:\s*(.+?)\s*$/);
      if (h) items.push({ href: h[1].replace(/^["']|["']$/g, ''), text: '' });
      else if (t && items.length) items[items.length - 1].text = t[1].replace(/^"(.*)"$/, '$1').replace(/\\"/g, '"');
    }
    end = i;
    return { lines: lines, start: start, end: end, ind: ind, items: items };
  }
  function buildNav(p, items) {
    var a = p.ind + '  ', b = p.ind + '    ';
    var block = items.map(function (it) {
      return a + '- href: ' + it.href + '\n' + b + 'text: "' + it.text.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    });
    return p.lines.slice(0, p.start + 1).concat(block, p.lines.slice(p.end)).join('\n');
  }
  function slugify(name) {
    return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  }

  function openTabs(host) {
    var inline = !!(host && host.nodeType === 1);

    if (inline) { host.innerHTML = ''; wrap = document.createElement('div'); wrap.className = 'tb-inline'; }
    else { var old = document.getElementById('me-editor'); if (old) old.remove(); wrap = document.createElement('div'); wrap.id = 'me-editor'; }
    wrap.innerHTML =
      '<div class="' + (inline ? 'tb-card-inline' : 'ed-card tb-card') + '">' +
        (inline ? '' : '<div class="ed-head"><strong>탭 관리</strong><span class="ed-path">순서 바꾸기 · 추가 · 삭제 · 이름 바꾸기</span>' +
        '<button class="ed-close" type="button">닫기</button></div>') +
        '<div class="ed-setup" hidden><p class="ed-setup-msg"><b>처음 한 번만</b> 깃허브 열쇠(토큰)를 넣어 주세요. 이 브라우저에만 저장돼요.</p>' + TOKEN_HELP +
          '<div class="ed-row"><input class="ed-token" type="password" placeholder="github_pat_로 시작하는 글자"><button class="ed-token-save" type="button">저장</button></div></div>' +
