# 깃허브에서 글을 고치면 홈페이지를 자동으로 다시 만들고, 비공개 탭을 비밀번호로 잠가요.
# 비밀번호는 저장소 Settings → Secrets and variables → Actions의 SITE_PASSWORD에 넣어 두세요.
name: 홈페이지 자동 빌드

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 홈페이지 만들기
        run: |
          quarto render
          touch docs/.nojekyll

      - name: 비공개 탭 잠그기
        env:
          PW: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "SITE_PASSWORD가 없어요. 저장소 Settings → Secrets and variables → Actions에서 추가해 주세요."
            exit 1
          fi
          npx -y staticrypt docs/private/*.html \
            -p "$PW" \
            -d docs/private \
            --short \
            --remember 30 \
            --template-title "Heejin Roh" \
            --template-instructions "나만 볼 수 있는 페이지예요." \
            --template-button "열기" \
            --template-color-primary "#B5562E" \
            --template-color-secondary "#FBF7F3"

      - name: 결과 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "바뀐 게 없어요."
          else
            git commit -m "홈페이지 자동 빌드"
            git push
          fi
