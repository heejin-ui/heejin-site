# 깃허브에서 글을 고치면 홈페이지를 자동으로 다시 만들어요.
# 비공개 탭 내용은 private-data에 암호화돼 있어서 다시 만들 필요가 없어요.
name: 홈페이지 자동 빌드

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'private-data/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: 홈페이지 만들기
        run: |
          quarto render
          touch docs/.nojekyll

      - name: 결과 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "바뀐 게 없어요."
          else
            git commit -m "홈페이지 자동 빌드"
            git push
          fi
