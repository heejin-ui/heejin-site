<script>
(function () {
  var KEY = 'hj-me', THEME = 'hj-theme', FONT = 'hj-font';
  // 깃허브 저장소 이름. 저장소 이름이나 아이디를 바꾸면 여기도 바꿔 주세요.
  var REPO = 'heejin-ui/heejin-site';
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }

  var q = new URLSearchParams(location.search);
  if (q.get('me') === 'on') set(KEY, '1');
  if (q.get('me') === 'off') { del(KEY); del(THEME); del(FONT); }
  if (get(KEY) !== '1') return;

  var PRESETS = [
    { n: '연분홍', bg: '#FDF4F7', ac: '#C2557E' },
    { n: '연보라', bg: '#F7F5FD', ac: '#7B68C8' },
    { n: '분홍 + 연보라', bg: '#FDF4F7', ac: '#7B68C8' },
    { n: '테라코타 (남들이 보는 색)', bg: '#FBF7F3', ac: '#B5562E' }
  ];
  var FONTS = [
    { n: '기본 · 나눔명조 + 노토 산스', h: "'Nanum Myeongjo', serif", b: "'Noto Sans KR', sans-serif" },
    { n: '고운바탕 + 고운돋움', h: "'Gowun Batang', serif", b: "'Gowun Dodum', sans-serif" },
    { n: '나눔손글씨 펜 + 고운돋움', h: "'Nanum Pen Script', cursive", b: "'Gowun Dodum', sans-serif" },
    { n: '주아 + 고운돋움', h: "'Jua', sans-serif", b: "'Gowun Dodum', sans-serif" }
  ];
  var PRIVATE = [
    ['My space', 'private/myspace.html'],
    ['Roadmap', 'private/roadmap.html'],
    ['Schools', 'private/schools.html'],
    ['Reading list', 'private/reading.html'],
    ['English', 'private/english.html']
  ];

  function hexToHsl(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, s = 0, h = 0;
    if (mx !== mn) {
      var d = mx - mn;
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
  }
  function hsl(h, s, l) { return 'hsl(' + h + ',' + s + '%,' + l + '%)'; }
  function lightBg(ac) { var c = hexToHsl(ac); return hslToHex(c[0], Math.max(c[1], 50), 97); }
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; }, a = s * Math.min(l, 1 - l);
    var f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
    var x = function (v) { return Math.round(v * 255).toString(16).padStart(2, '0'); };
    return '#' + x(f(0)) + x(f(8)) + x(f(4));
  }

  function applyTheme(t) {
    var a = hexToHsl(t.ac), b = hexToHsl(t.bg), r = document.documentElement.style;
    r.setProperty('--site-bg', t.bg);
    r.setProperty('--site-accent', hsl(a[0], Math.min(a[1], 70), Math.min(a[2], 45)));
    r.setProperty('--site-soft', hsl(b[0], Math.max(b[1], 40), 90));
    r.setProperty('--site-text', hsl(a[0], 30, 18));
    r.setProperty('--site-sub', hsl(a[0], 18, 42));
  }
  function applyFont(i) {
    var f = FONTS[i] || FONTS[0], r = document.documentElement.style;
    r.setProperty('--font-head', f.h);
    r.setProperty('--font-body', f.b);
  }

  var theme = PRESETS[2], fontIdx = 0;
  try { var st = JSON.parse(get(THEME)); if (st && st.bg && st.ac) theme = st; } catch (e) {}
  var sf = parseInt(get(FONT), 10); if (!isNaN(sf)) fontIdx = sf;
  var savedTheme = theme, savedFont = fontIdx;
  applyTheme(theme); applyFont(fontIdx);

  document.addEventListener('DOMContentLoaded', init);
  if (document.readyState !== 'loading') init();

  var done = false;
  function init() {
    if (done) return; done = true;
    var brand = document.querySelector('.navbar-brand');
    var rootUrl = new URL(brand && brand.getAttribute('href') ? brand.getAttribute('href') : './', location.href);
    rootUrl.search = ''; rootUrl.hash = '';
    var root = rootUrl.href.replace(/[^\/]*$/, '');

    var nav = document.querySelector('.navbar .navbar-nav');
    if (nav) {
      PRIVATE.forEach(function (p) {
        var li = document.createElement('li'); li.className = 'nav-item';
        var a = document.createElement('a'); a.className = 'nav-link me-link'; a.href = root + p[1];
        a.innerHTML = '<span class="menu-text">' + p[0] + '</span>';
        li.appendChild(a); nav.appendChild(li);
      });
    }

    var box = document.createElement('div'); box.id = 'me-tools';
    box.innerHTML =
      '<div id="me-panel"></div>' +
      '<button class="me-btn" data-open="color">오늘의 색</button>' +
      '<button class="me-btn" data-open="font">글씨체</button>';
    document.body.appendChild(box);

    // 이 페이지 수정: 공개 페이지는 원본 글을, 비공개 탭은 암호화된 내용을 고쳐요
    var here = location.href.split('#')[0].split('?')[0];
    var priv = document.getElementById('private-content');
    if (priv) {
      var titleEl = document.querySelector('h1.title');
      privateInit(priv, priv.getAttribute('data-key'), titleEl ? titleEl.textContent : '', box);
    } else if (here.indexOf(root) === 0) {
      var rel = here.slice(root.length);
      if (rel === '' || /\/$/.test(rel)) rel += 'index.html';
      if (/\.html$/.test(rel)) {
        var qmdPath = rel.replace(/\.html$/, '.qmd');
        var ed = document.createElement('a');
        ed.className = 'me-btn me-edit';
        ed.href = 'https://github.com/' + REPO + '/edit/main/' + qmdPath;
        ed.textContent = '이 페이지 수정';
        ed.addEventListener('click', function (e) { e.preventDefault(); openEditor({ kind: 'qmd', path: qmdPath, label: qmdPath }); });
        box.appendChild(ed);
      }
    }
    var panel = box.querySelector('#me-panel'), mode = null;

    box.querySelectorAll('.me-btn[data-open]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var m = btn.getAttribute('data-open');
        if (mode === m && panel.classList.contains('open')) { panel.classList.remove('open'); mode = null; return; }
        mode = m; draw(); panel.classList.add('open');
      });
    });

    function dirty() {
      return theme.bg !== savedTheme.bg || theme.ac !== savedTheme.ac || fontIdx !== savedFont;
    }
    function actions(msg) {
      var d = dirty();
      return '<div class="me-actions">' +
        '<span class="me-status">' + (msg || (d ? '미리보기 중이에요. 저장해야 다음에도 유지돼요.' : '저장된 상태예요.')) + '</span>' +
        '<button class="me-undo"' + (d ? '' : ' disabled') + '>되돌리기</button>' +
        '<button class="me-save"' + (d ? '' : ' disabled') + '>저장</button></div>';
    }
    function bindActions() {
      panel.querySelector('.me-save').addEventListener('click', function () {
        set(THEME, JSON.stringify(theme)); set(FONT, String(fontIdx));
        savedTheme = theme; savedFont = fontIdx;
        draw('저장했어요!');
      });
      panel.querySelector('.me-undo').addEventListener('click', function () {
        theme = savedTheme; fontIdx = savedFont;
        applyTheme(theme); applyFont(fontIdx); draw('저장된 색과 글씨체로 돌아왔어요.');
      });
    }
    function refreshActions() {
      var old = panel.querySelector('.me-actions');
      var tmp = document.createElement('div'); tmp.innerHTML = actions();
      old.replaceWith(tmp.firstChild); bindActions();
    }

    function draw(msg) {
      if (mode === 'color') {
        var html = '<p>정해둔 색</p><div class="row">';
        PRESETS.forEach(function (p, i) {
          var on = p.bg === theme.bg && p.ac === theme.ac ? ' on' : '';
          html += '<button class="dot' + on + '" title="' + p.n + '" aria-label="' + p.n + '" data-i="' + i + '" style="background:' + p.ac + '"></button>';
        });
        html += '</div><p>직접 고르기</p><div class="row">' +
          '<label>강조색 <input type="color" id="me-ac" value="' + theme.ac + '"></label>' +
          '<label>바탕색 <input type="color" id="me-bg" value="' + theme.bg + '"></label>' +
          '<label><input type="checkbox" id="me-auto" checked> 바탕색 자동</label></div>';
        panel.innerHTML = html + actions(msg);
        panel.querySelectorAll('.dot').forEach(function (d) {
          d.addEventListener('click', function () { theme = PRESETS[+d.getAttribute('data-i')]; applyTheme(theme); draw(); });
        });
        panel.querySelector('#me-ac').addEventListener('input', function (e) {
          var bg = panel.querySelector('#me-auto').checked ? lightBg(e.target.value) : theme.bg;
          theme = { n: '직접 고른 색', ac: e.target.value, bg: bg };
          panel.querySelector('#me-bg').value = bg; applyTheme(theme); refreshActions();
        });
        panel.querySelector('#me-bg').addEventListener('input', function (e) {
          panel.querySelector('#me-auto').checked = false;
          theme = { n: '직접 고른 색', ac: theme.ac, bg: e.target.value }; applyTheme(theme); refreshActions();
        });
      } else {
        var h = '<p>글씨체</p>';
        FONTS.forEach(function (f, i) {
          h += '<button class="font-opt' + (i === fontIdx ? ' on' : '') + '" data-i="' + i + '" style="font-family:' + f.h.replace(/"/g, "'") + '">' + f.n + '</button>';
        });
        panel.innerHTML = h + actions(msg);
        panel.querySelectorAll('.font-opt').forEach(function (b) {
          b.addEventListener('click', function () { fontIdx = +b.getAttribute('data-i'); applyFont(fontIdx); draw(); });
        });
      }
      bindActions();
    }
  }

  /* ---------- 홈페이지 안에서 바로 고치는 편집기 ---------- */
  var TOKEN = 'hj-gh-token', PKEY = 'hj-pkey', PDIR = 'private-data/';
  function b64enc(str) { var b = new TextEncoder().encode(str), bin = ''; for (var i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]); return btoa(bin); }
  function b64dec(b64) { var bin = atob(b64.replace(/\s/g, '')), b = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return new TextDecoder().decode(b); }
  function bytesToB64(u8) { var bin = ''; for (var i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]); return btoa(bin); }
  function b64ToBytes(b64) { var bin = atob(b64), u8 = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8; }
  function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  /* 깃허브 읽기·쓰기 */
  function apiUrl(path) { return 'https://api.github.com/repos/' + REPO + '/contents/' + path; }
  function ghHeaders() { return { 'Authorization': 'Bearer ' + get(TOKEN), 'Accept': 'application/vnd.github+json' }; }
  function check(r) {
    if (r.status === 401) throw new Error('auth');
    if (r.status === 409 || r.status === 422) throw new Error('conflict');
    if (!r.ok) throw new Error('http' + r.status);
    return r;
  }
  function ghGet(path) {
    if (get(TOKEN)) {
      return fetch(apiUrl(path) + '?ref=main', { headers: ghHeaders(), cache: 'no-store' }).then(function (r) {
        if (r.status === 404) return null;
        return check(r).json().then(function (j) { return { sha: j.sha, text: b64dec(j.content) }; });
      });
    }
    return fetch('https://raw.githubusercontent.com/' + REPO + '/main/' + path + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (r.status === 404) return null;
      return check(r).text().then(function (t) { return { sha: null, text: t }; });
    });
  }
  function ghPut(path, text, msg) {
    return fetch(apiUrl(path) + '?ref=main', { headers: ghHeaders(), cache: 'no-store' }).then(function (r) {
      if (r.status === 404) return null;
      return check(r).json().then(function (j) { return j.sha; });
    }).then(function (sha) {
      var body = { message: msg, content: b64enc(text), branch: 'main' };
      if (sha) body.sha = sha;
      return fetch(apiUrl(path), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) });
    }).then(function (r) { return check(r).json(); });
  }

  /* 암호화: 비밀번호 → 열쇠 (PBKDF2), 내용 → AES-GCM */
  function deriveKey(pw, salt, iter) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
    });
  }
  function encText(key, text) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(text)).then(function (ct) {
      return { v: 1, iv: bytesToB64(iv), ct: bytesToB64(new Uint8Array(ct)) };
    });
  }
  function decText(key, o) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(o.iv) }, key, b64ToBytes(o.ct)).then(function (pt) { return new TextDecoder().decode(pt); });
  }
  function cachedKey(salt) {
    try {
      var c = JSON.parse(get(PKEY));
      if (c && c.salt === salt) return crypto.subtle.importKey('raw', b64ToBytes(c.k), 'AES-GCM', true, ['encrypt', 'decrypt']);
    } catch (e) {}
    return Promise.resolve(null);
  }
  function cacheKey(key, salt) {
    return crypto.subtle.exportKey('raw', key).then(function (raw) { set(PKEY, JSON.stringify({ salt: salt, k: bytesToB64(new Uint8Array(raw)) })); });
  }

  /* 미리보기용 간단한 글 변환 */
  function inline(t) {
    t = esc(t);
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    t = t.replace(/\[([^\]]+)\]\{\.([\w-]+)\}/g, '<span class="$2">$1</span>');
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, a, u) { return '<a href="' + u.replace(/\.qmd$/, '.html') + '">' + a + '</a>'; });
    return t;
  }
  function md(src) {
    var L = src.replace(/\r/g, '').split('\n'), out = '', i = 0;
    function isStart(l) { return /^(#{1,6}\s|>|\s*[-*]\s|\s*\d+\.\s|:::|\|)/.test(l); }
    while (i < L.length) {
      var l = L[i], m;
      if (!l.trim()) { i++; continue; }
      if ((m = l.match(/^:::\s*\{\.([\w-]+)\}/))) {
        var inner = []; i++;
        while (i < L.length && !/^:::\s*$/.test(L[i])) inner.push(L[i++]);
        i++; out += '<div class="' + m[1] + '">' + md(inner.join('\n')) + '</div>'; continue;
      }
      if ((m = l.match(/^(#{1,6})\s+(.*)/))) { var n = m[1].length; out += '<h' + n + '>' + inline(m[2]) + '</h' + n + '>'; i++; continue; }
      if (/^>/.test(l)) { var q = []; while (i < L.length && /^>/.test(L[i])) q.push(L[i++].replace(/^>\s?/, '')); out += '<blockquote>' + md(q.join('\n')) + '</blockquote>'; continue; }
      if (/^\s*[-*]\s/.test(l) || /^\s*\d+\.\s/.test(l)) {
        var ol = /^\s*\d+\.\s/.test(l), items = [];
        while (i < L.length && (ol ? /^\s*\d+\.\s/ : /^\s*[-*]\s/).test(L[i])) items.push(L[i++].replace(/^\s*([-*]|\d+\.)\s+/, ''));
        out += (ol ? '<ol>' : '<ul>') + items.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + (ol ? '</ol>' : '</ul>'); continue;
      }
      if (/^\|/.test(l) && i + 1 < L.length && /^\|?\s*:?-{2,}/.test(L[i + 1])) {
        var cells = function (r) { return r.trim().replace(/^\||\|$/g, '').split('|'); };
        var head = cells(l); i += 2; var rows = '';
        while (i < L.length && /^\|/.test(L[i])) { rows += '<tr>' + cells(L[i++]).map(function (c) { return '<td>' + inline(c.trim()) + '</td>'; }).join('') + '</tr>'; }
        out += '<table class="table"><thead><tr>' + head.map(function (c) { return '<th>' + inline(c.trim()) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows + '</tbody></table>'; continue;
      }
      var para = [l]; i++;
      while (i < L.length && L[i].trim() && !isStart(L[i])) para.push(L[i++]);
      out += '<p>' + inline(para.join(' ')) + '</p>';
    }
    return out;
  }

  function splitFront(text) {
    var m = text.match(/^---\n([\s\S]*?)\n---\n?/);
    if (!m) return { fm: null, body: text };
    return { fm: m[1], body: text.slice(m[0].length).replace(/^\n/, '') };
  }
  function fmGet(fm, key) {
    var m = fm && fm.match(new RegExp('^' + key + ':\\s*(.*)$', 'm'));
    if (!m) return null;
    var v = m[1].trim();
    if (/^".*"$/.test(v)) v = v.slice(1, -1).replace(/\\"/g, '"').replace(/\\\\/g, '\\');
    else if (/^'.*'$/.test(v)) v = v.slice(1, -1).replace(/''/g, "'");
    return v;
  }
  function fmSet(fm, key, val, after) {
    var line = key + ': "' + val.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    var re = new RegExp('^' + key + ':.*$', 'm');
    if (re.test(fm)) return fm.replace(re, function () { return line; });
    if (!val) return fm;
    var ra = new RegExp('^' + after + ':.*$', 'm');
    return ra.test(fm) ? fm.replace(ra, function (x) { return x + '\n' + line; }) : fm + '\n' + line;
  }

  var TOKEN_HELP =
    '<ol><li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 만들기 화면 열기</a></li>' +
    '<li>Repository access에서 <b>Only select repositories</b> → <b>heejin-site</b>만 고르기</li>' +
    '<li>Permissions에서 <b>Contents</b>를 찾아 <b>Read and write</b>로</li>' +
    '<li>Generate token을 누르고 나온 글자를 복사해서 아래에 붙여 넣기</li></ol>';

  /* 편집 창. o.kind: 'qmd'(공개 글) 또는 'enc'(비공개 암호화 글) */
  function openEditor(o) {
    var old = document.getElementById('me-editor'); if (old) old.remove();
    var wrap = document.createElement('div'); wrap.id = 'me-editor';
    wrap.innerHTML =
      '<div class="ed-card">' +
        '<div class="ed-head"><strong>' + (o.kind === 'enc' ? '비공개 페이지 수정' : '페이지 수정') + '</strong><span class="ed-path">' + esc(o.label || '') + '</span>' +
        '<button class="ed-close" type="button">닫기</button></div>' +
        '<div class="ed-setup" hidden>' +
          '<p class="ed-setup-msg"><b>처음 한 번만</b> 깃허브 열쇠(토큰)를 넣어 주세요. 이 브라우저에만 저장돼요.</p>' + TOKEN_HELP +
          '<div class="ed-row"><input class="ed-token" type="password" placeholder="github_pat_로 시작하는 글자"><button class="ed-token-save" type="button">저장</button></div>' +
        '</div>' +
        '<div class="ed-main" hidden>' +
          (o.kind === 'qmd' ? '<div class="ed-fields"><label>제목 <input class="ed-title"></label><label>부제 <input class="ed-sub"></label></div>' : '') +
          '<div class="ed-tools">' +
            '<button type="button" data-t="h2">큰 소제목</button><button type="button" data-t="h3">작은 소제목</button>' +
            '<button type="button" data-t="b">굵게</button><button type="button" data-t="i">기울임</button>' +
            '<button type="button" data-t="ul">목록</button><button type="button" data-t="a">링크</button>' +
            '<button type="button" data-t="file">파일 불러오기</button><input type="file" class="ed-file" accept=".md,.txt,.qmd" hidden>' +
            '<span class="ed-tip">왼쪽에 쓰면 오른쪽에 바로 보여요</span></div>' +
          '<div class="ed-split"><textarea class="ed-text" spellcheck="false"></textarea><div class="ed-preview"></div></div>' +
          '<div class="ed-foot"><span class="ed-status"></span>' +
            (o.kind === 'enc' ? '<span class="ed-lock">비밀번호로 암호화해서 저장돼요</span>' : '') +
            '<button class="ed-forget" type="button">토큰 지우기</button>' +
            '<button class="ed-apply" type="button">적용</button></div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var $ = function (c) { return wrap.querySelector(c); };
    var ta = $('.ed-text'), pv = $('.ed-preview'), status = $('.ed-status');
    var state = { fm: null, dirty: false };

    function close() {
      if (state.dirty && !confirm('적용하지 않은 내용이 있어요. 그래도 닫을까요?')) return;
      wrap.remove();
    }
    $('.ed-close').addEventListener('click', close);
    wrap.addEventListener('click', function (e) { if (e.target === wrap) close(); });

    function preview() { pv.innerHTML = (state.fm !== null && fmGet(state.fm, 'listing') !== null ? '<p class="ed-tip">이 페이지의 목록은 Notes 글에서 자동으로 만들어져요.</p>' : '') + md(ta.value); }
    function markDirty() { state.dirty = true; status.textContent = '아직 적용 안 했어요.'; preview(); }
    ta.addEventListener('input', markDirty);
    if (o.kind === 'qmd') { $('.ed-title').addEventListener('input', markDirty); $('.ed-sub').addEventListener('input', markDirty); }

    function wrapSel(a, b, ph) {
      var s0 = ta.selectionStart, s1 = ta.selectionEnd, sel = ta.value.slice(s0, s1) || ph;
      ta.setRangeText(a + sel + b, s0, s1, 'end'); ta.focus(); markDirty();
    }
    function prefixLine(pre) {
      var s0 = ta.selectionStart, st = ta.value.lastIndexOf('\n', s0 - 1) + 1;
      ta.setRangeText(pre, st, st, 'end'); ta.focus(); markDirty();
    }
    wrap.querySelectorAll('.ed-tools button').forEach(function (b) {
      b.addEventListener('click', function () {
        var t = b.getAttribute('data-t');
        if (t === 'h2') prefixLine('## ');
        else if (t === 'h3') prefixLine('### ');
        else if (t === 'b') wrapSel('**', '**', '굵게 쓸 말');
        else if (t === 'i') wrapSel('*', '*', '기울일 말');
        else if (t === 'ul') prefixLine('- ');
        else if (t === 'a') { var u = prompt('연결할 주소를 넣어 주세요', 'https://'); if (u) wrapSel('[', '](' + u + ')', '링크 글자'); }
        else if (t === 'file') $('.ed-file').click();
      });
    });
    $('.ed-file').addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return;
      if (ta.value.trim() && !confirm('지금 쓴 내용을 파일 내용으로 바꿀까요?')) { e.target.value = ''; return; }
      f.text().then(function (t) { ta.value = splitFront(t.replace(/\r/g, '')).body; markDirty(); e.target.value = ''; });
    });

    function showSetup(msg) { $('.ed-setup').hidden = false; $('.ed-main').hidden = true; if (msg) $('.ed-setup-msg').innerHTML = msg; }
    $('.ed-token-save').addEventListener('click', function () {
      var v = $('.ed-token').value.trim(); if (!v) return;
      set(TOKEN, v); $('.ed-setup').hidden = true; load();
    });
    $('.ed-forget').addEventListener('click', function () {
      if (!confirm('이 브라우저에 저장된 토큰을 지울까요?')) return;
      del(TOKEN); showSetup();
    });
    function fail(e, doing) {
      if (e.message === 'auth') showSetup('<b>토큰이 맞지 않거나 기한이 지났어요.</b> 새로 만들어서 넣어 주세요.');
      else if (e.message === 'conflict') status.textContent = '그사이 다른 곳에서 이 파일이 바뀌었어요. 쓴 내용을 복사해 두고 다시 열어 주세요.';
      else status.textContent = doing + ' 못했어요 (' + e.message + '). 토큰에 heejin-site와 Contents 쓰기 권한이 있는지 확인해 주세요.';
    }

    function load() {
      if (!get(TOKEN)) { showSetup(); return; }
      $('.ed-main').hidden = false;
      if (o.kind === 'enc') { ta.value = o.body || ''; state.dirty = false; status.textContent = ''; preview(); return; }
      status.textContent = '불러오는 중…';
      ghGet(o.path).then(function (f) {
        if (!f) throw new Error('파일 없음');
        var sp = splitFront(f.text); state.fm = sp.fm;
        $('.ed-title').value = fmGet(sp.fm, 'title') || '';
        $('.ed-sub').value = fmGet(sp.fm, 'subtitle') || fmGet(sp.fm, 'description') || '';
        ta.value = sp.body; state.dirty = false; status.textContent = ''; preview();
      }).catch(function (e) { fail(e, '불러오지'); });
    }

    $('.ed-apply').addEventListener('click', function () {
      if (!state.dirty) { status.textContent = '바뀐 게 없어요.'; return; }
      var body = ta.value.replace(/\s+$/, '') + '\n', job;
      if (o.kind === 'enc') {
        job = o.save(body);
      } else {
        var fm = state.fm;
        if (fm !== null) {
          fm = fmSet(fm, 'title', $('.ed-title').value.trim(), 'title');
          var subKey = fmGet(fm, 'subtitle') === null && fmGet(fm, 'description') !== null ? 'description' : 'subtitle';
          fm = fmSet(fm, subKey, $('.ed-sub').value.trim(), 'title');
        }
        job = ghPut(o.path, (fm !== null ? '---\n' + fm + '\n---\n\n' : '') + body, '홈페이지에서 수정: ' + o.path);
      }
      var btn = $('.ed-apply'); btn.disabled = true; status.textContent = '저장하는 중…';
      job.then(function () {
        state.dirty = false; btn.disabled = false;
        if (o.kind === 'enc') { status.textContent = '적용했어요! 바로 반영됐어요.'; o.onSaved(body); }
        else { status.textContent = '적용했어요! 이 화면엔 바로 보이고, 홈페이지 전체에는 2~3분 뒤 반영돼요.'; showOnPage(); }
      }).catch(function (e) { btn.disabled = false; fail(e, '저장하지'); });
    });

    function showOnPage() {
      var main = document.querySelector('main') || document.querySelector('#quarto-document-content');
      if (!main) return;
      var h1 = document.querySelector('#title-block-header h1.title, h1.title');
      if (h1) h1.textContent = $('.ed-title').value;
      var sub = document.querySelector('#title-block-header .subtitle, p.subtitle');
      if (sub) sub.textContent = $('.ed-sub').value;
      if (document.querySelector('.quarto-listing')) return;
      var hdr = main.querySelector('#title-block-header');
      Array.prototype.slice.call(main.children).forEach(function (c) { if (c !== hdr) c.remove(); });
      var div = document.createElement('div'); div.innerHTML = md(ta.value); main.appendChild(div);
    }

    load();
  }

  /* 비공개 탭: 비밀번호로 열고, 같은 편집 창으로 고치기 */
  function privateInit(el, pkey, label, box) {
    var keyFile = null, key = null, body = '', btnAdded = false;
    var ALL = PRIVATE.map(function (p) { return p[1].replace(/^private\/|\.html$/g, ''); });

    function msg(html) { el.innerHTML = '<div class="pv-box">' + html + '</div>'; }
    function fail(e) {
      if (e.message === 'auth') { del(TOKEN); msg('<p>깃허브 토큰이 맞지 않거나 기한이 지났어요. 새로고침한 뒤 다시 넣어 주세요.</p>'); }
      else msg('<p>불러오지 못했어요 (' + esc(e.message) + '). 잠시 뒤 새로고침해 주세요.</p>');
    }
    function verify(k) {
      return decText(k, keyFile.check).then(function (t) { return t === 'heejin-ok'; }, function () { return false; });
    }

    function askPw(err) {
      msg('<p>이 페이지는 잠겨 있어요. 비공개 탭 비밀번호를 넣어 주세요.</p>' +
        '<div class="ed-row"><input type="password" class="pv-pw" placeholder="비밀번호"><button type="button" class="pv-open">열기</button></div>' +
        '<label class="pv-check"><input type="checkbox" class="pv-remember" checked> 이 기기에서 기억하기</label>' +
        '<p class="pv-err">' + (err || '') + '</p>');
      var pw = el.querySelector('.pv-pw'), go = el.querySelector('.pv-open');
      function submit() {
        if (!pw.value) return;
        go.disabled = true; el.querySelector('.pv-err').textContent = '여는 중…';
        deriveKey(pw.value, b64ToBytes(keyFile.salt), keyFile.iter).then(function (k) {
          return verify(k).then(function (ok) {
            if (!ok) return askPw('비밀번호가 맞지 않아요.');
            key = k;
            var keep = el.querySelector('.pv-remember').checked;
            return (keep ? cacheKey(k, keyFile.salt) : Promise.resolve()).then(showContent);
          });
        });
      }
      go.addEventListener('click', submit);
      pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
      pw.focus();
    }

    function tokenStep(next) {
      msg('<p><b>처음 한 번만</b> 깃허브 열쇠(토큰)를 넣어 주세요. 이 브라우저에만 저장돼요.</p>' + TOKEN_HELP +
        '<div class="ed-row"><input type="password" class="pv-token" placeholder="github_pat_로 시작하는 글자"><button type="button" class="pv-token-save">저장</button></div>');
      el.querySelector('.pv-token-save').addEventListener('click', function () {
        var v = el.querySelector('.pv-token').value.trim(); if (!v) return;
        set(TOKEN, v); next();
      });
    }

    function setupFlow() {
      if (!get(TOKEN)) return tokenStep(setupFlow);
      msg('<p><b>처음 설정</b> 비공개 탭에 쓸 비밀번호를 정해 주세요. 이 비밀번호를 잊으면 내용을 되살릴 수 없으니 꼭 따로 적어 두세요.</p>' +
        '<div class="pv-form"><input type="password" class="pv-pw1" placeholder="비밀번호 (8자 이상)">' +
        '<input type="password" class="pv-pw2" placeholder="한 번 더"></div>' +
        '<p>처음 내용 파일이 있으면 같이 골라 주세요. 여러 개를 한 번에 골라도 돼요. (선택)</p>' +
        '<input type="file" class="pv-files" accept=".md,.txt" multiple>' +
        '<p><button type="button" class="pv-setup">설정하기</button></p><p class="pv-err"></p>');
      el.querySelector('.pv-setup').addEventListener('click', function () {
        var p1 = el.querySelector('.pv-pw1').value, p2 = el.querySelector('.pv-pw2').value, err = el.querySelector('.pv-err');
        if (p1.length < 8) { err.textContent = '비밀번호는 8자 이상으로 정해 주세요.'; return; }
        if (p1 !== p2) { err.textContent = '두 비밀번호가 달라요.'; return; }
        var files = Array.prototype.slice.call(el.querySelector('.pv-files').files);
        this.disabled = true; err.textContent = '설정하는 중…';
        var salt = crypto.getRandomValues(new Uint8Array(16)), saltB64 = bytesToB64(salt), iter = 310000;
        deriveKey(p1, salt, iter).then(function (k) {
          key = k;
          return encText(k, 'heejin-ok');
        }).then(function (chk) {
          keyFile = { v: 1, salt: saltB64, iter: iter, check: chk };
          return ghPut(PDIR + 'key.json', JSON.stringify(keyFile, null, 2) + '\n', '비공개 탭 비밀번호 설정');
        }).then(function () {
          return files.reduce(function (pr, f) {
            var name = f.name.replace(/\.(md|txt)$/i, '').toLowerCase();
            if (ALL.indexOf(name) < 0) return pr;
            return pr.then(function () {
              err.textContent = name + ' 불러오는 중…';
              return f.text().then(function (t) { return encText(key, t.replace(/\r/g, '')); })
                .then(function (o) { return ghPut(PDIR + name + '.enc', JSON.stringify(o) + '\n', '비공개 탭 처음 내용: ' + name); });
            });
          }, Promise.resolve());
        }).then(function () { return cacheKey(key, saltB64); })
          .then(showContent)
          .catch(fail);
      });
    }

    function render() {
      el.innerHTML = body.trim() ? md(body) : '<p class="pv-empty">아직 내용이 없어요. 오른쪽 아래 "이 페이지 수정"을 눌러 써 보세요.</p>';
      var lock = document.createElement('p'); lock.className = 'pv-lockline';
      lock.innerHTML = '<a href="#">이 기기에서 잠그기</a>';
      lock.querySelector('a').addEventListener('click', function (e) { e.preventDefault(); del(PKEY); location.reload(); });
      el.appendChild(lock);
    }

    function showContent() {
      msg('<p>불러오는 중…</p>');
      return ghGet(PDIR + pkey + '.enc').then(function (f) {
        return f ? decText(key, JSON.parse(f.text)) : '';
      }).then(function (t) {
        body = t; render();
        if (btnAdded) return;
        btnAdded = true;
        var ed = document.createElement('a');
        ed.className = 'me-btn me-edit'; ed.href = '#'; ed.textContent = '이 페이지 수정';
        ed.addEventListener('click', function (e) {
          e.preventDefault();
          openEditor({
            kind: 'enc', label: label, body: body,
            save: function (newBody) {
              return encText(key, newBody).then(function (o) {
                return ghPut(PDIR + pkey + '.enc', JSON.stringify(o) + '\n', '비공개 탭 수정: ' + pkey);
              });
            },
            onSaved: function (newBody) { body = newBody; render(); }
          });
        });
        box.appendChild(ed);
      }).catch(function (e) {
        if (e && e.name === 'OperationError') { del(PKEY); askPw('저장된 열쇠가 맞지 않아요. 비밀번호를 다시 넣어 주세요.'); }
        else fail(e);
      });
    }

    msg('<p>불러오는 중…</p>');
    ghGet(PDIR + 'key.json').then(function (kf) {
      if (!kf) return setupFlow();
      keyFile = JSON.parse(kf.text);
      return cachedKey(keyFile.salt).then(function (k) {
        if (!k) return askPw();
        return verify(k).then(function (ok) {
          if (!ok) { del(PKEY); return askPw(); }
          key = k; return showContent();
        });
      });
    }).catch(fail);
  }
})();
</script>
