<script>
(function () {
  var KEY = 'hj-me', THEME = 'hj-theme', FONT = 'hj-font';
  // 깃허브 저장소 이름. 저장소 이름이나 아이디를 바꾸면 여기도 바꿔 주세요.
  var REPO = 'heejin-ui/heejin-site';
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }

  var q = new URLSearchParams(location.search);
  if (q.get('me') === 'on') set(KEY, '1');
  if (q.get('me') === 'off') { del(KEY); del(THEME); del(FONT); }
  if (get(KEY) !== '1') return;

  var PRESETS = [
    { n: '연분홍', bg: '#FDF4F7', ac: '#C2557E' },
    { n: '연보라', bg: '#F7F5FD', ac: '#7B68C8' },
    { n: '분홍 + 연보라', bg: '#FDF4F7', ac: '#7B68C8' },
    { n: '테라코타 (남들이 보는 색)', bg: '#FBF7F3', ac: '#B5562E' }
  ];
  var FONTS = [
    { n: '기본 · 나눔명조 + 노토 산스', h: "'Nanum Myeongjo', serif", b: "'Noto Sans KR', sans-serif" },
    { n: '고운바탕 + 고운돋움', h: "'Gowun Batang', serif", b: "'Gowun Dodum', sans-serif" },
    { n: '나눔손글씨 펜 + 고운돋움', h: "'Nanum Pen Script', cursive", b: "'Gowun Dodum', sans-serif" },
    { n: '주아 + 고운돋움', h: "'Jua', sans-serif", b: "'Gowun Dodum', sans-serif" }
  ];
  var PRIVATE = [
    ['My space', 'private/myspace.html'],
    ['Roadmap', 'private/roadmap.html'],
    ['Schools', 'private/schools.html'],
    ['Reading list', 'private/reading.html'],
    ['English', 'private/english.html']
  ];

  function hexToHsl(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, s = 0, h = 0;
    if (mx !== mn) {
      var d = mx - mn;
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
  }
  function hsl(h, s, l) { return 'hsl(' + h + ',' + s + '%,' + l + '%)'; }
  function lightBg(ac) { var c = hexToHsl(ac); return hslToHex(c[0], Math.max(c[1], 50), 97); }
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; }, a = s * Math.min(l, 1 - l);
    var f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
    var x = function (v) { return Math.round(v * 255).toString(16).padStart(2, '0'); };
    return '#' + x(f(0)) + x(f(8)) + x(f(4));
  }

  function applyTheme(t) {
    var a = hexToHsl(t.ac), b = hexToHsl(t.bg), r = document.documentElement.style;
    r.setProperty('--site-bg', t.bg);
    r.setProperty('--site-accent', hsl(a[0], Math.min(a[1], 70), Math.min(a[2], 45)));
    r.setProperty('--site-soft', hsl(b[0], Math.max(b[1], 40), 90));
    r.setProperty('--site-text', hsl(a[0], 30, 18));
    r.setProperty('--site-sub', hsl(a[0], 18, 42));
  }
  function applyFont(i) {
    var f = FONTS[i] || FONTS[0], r = document.documentElement.style;
    r.setProperty('--font-head', f.h);
    r.setProperty('--font-body', f.b);
  }

  var theme = PRESETS[2], fontIdx = 0;
  try { var st = JSON.parse(get(THEME)); if (st && st.bg && st.ac) theme = st; } catch (e) {}
  var sf = parseInt(get(FONT), 10); if (!isNaN(sf)) fontIdx = sf;
  var savedTheme = theme, savedFont = fontIdx;
  applyTheme(theme); applyFont(fontIdx);

  document.addEventListener('DOMContentLoaded', init);
  if (document.readyState !== 'loading') init();

  var done = false;
  function init() {
    if (done) return; done = true;
    var brand = document.querySelector('.navbar-brand');
    var root = new URL(brand ? brand.getAttribute('href') : 'index.html', location.href);
    root = root.href.replace(/index\.html$/, '');

    var nav = document.querySelector('.navbar .navbar-nav');
    if (nav) {
      PRIVATE.forEach(function (p) {
        var li = document.createElement('li'); li.className = 'nav-item';
        var a = document.createElement('a'); a.className = 'nav-link me-link'; a.href = root + p[1];
        a.innerHTML = '<span class="menu-text">' + p[0] + '</span>';
        li.appendChild(a); nav.appendChild(li);
      });
    }

    var box = document.createElement('div'); box.id = 'me-tools';
    box.innerHTML =
      '<div id="me-panel"></div>' +
      '<button class="me-btn" data-open="color">오늘의 색</button>' +
      '<button class="me-btn" data-open="font">글씨체</button>';
    document.body.appendChild(box);

    // 이 페이지 수정: 공개 페이지는 깃허브 편집 화면으로 연결 (비공개 탭은 구글 문서 버튼을 써요)
    var here = location.href.split('#')[0].split('?')[0];
    if (here.indexOf(root) === 0) {
      var rel = here.slice(root.length);
      if (rel === '' || /\/$/.test(rel)) rel += 'index.html';
      if (/\.html$/.test(rel) && rel.indexOf('private/') !== 0) {
        var ed = document.createElement('a');
        ed.className = 'me-edit';
        ed.href = 'https://github.com/' + REPO + '/edit/main/' + rel.replace(/\.html$/, '.qmd');
        ed.target = '_blank'; ed.rel = 'noopener';
        ed.textContent = '이 페이지 수정';
        box.appendChild(ed);
      }
    }
    var panel = box.querySelector('#me-panel'), mode = null;

    box.querySelectorAll('.me-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var m = btn.getAttribute('data-open');
        if (mode === m && panel.classList.contains('open')) { panel.classList.remove('open'); mode = null; return; }
        mode = m; draw(); panel.classList.add('open');
      });
    });

    function dirty() {
      return theme.bg !== savedTheme.bg || theme.ac !== savedTheme.ac || fontIdx !== savedFont;
    }
    function actions(msg) {
      var d = dirty();
      return '<div class="me-actions">' +
        '<span class="me-status">' + (msg || (d ? '미리보기 중이에요. 저장해야 다음에도 유지돼요.' : '저장된 상태예요.')) + '</span>' +
        '<button class="me-undo"' + (d ? '' : ' disabled') + '>되돌리기</button>' +
        '<button class="me-save"' + (d ? '' : ' disabled') + '>저장</button></div>';
    }
    function bindActions() {
      panel.querySelector('.me-save').addEventListener('click', function () {
        set(THEME, JSON.stringify(theme)); set(FONT, String(fontIdx));
        savedTheme = theme; savedFont = fontIdx;
        draw('저장했어요!');
      });
      panel.querySelector('.me-undo').addEventListener('click', function () {
        theme = savedTheme; fontIdx = savedFont;
        applyTheme(theme); applyFont(fontIdx); draw('저장된 색과 글씨체로 돌아왔어요.');
      });
    }
    function refreshActions() {
      var old = panel.querySelector('.me-actions');
      var tmp = document.createElement('div'); tmp.innerHTML = actions();
      old.replaceWith(tmp.firstChild); bindActions();
    }

    function draw(msg) {
      if (mode === 'color') {
        var html = '<p>정해둔 색</p><div class="row">';
        PRESETS.forEach(function (p, i) {
          var on = p.bg === theme.bg && p.ac === theme.ac ? ' on' : '';
          html += '<button class="dot' + on + '" title="' + p.n + '" aria-label="' + p.n + '" data-i="' + i + '" style="background:' + p.ac + '"></button>';
        });
        html += '</div><p>직접 고르기</p><div class="row">' +
          '<label>강조색 <input type="color" id="me-ac" value="' + theme.ac + '"></label>' +
          '<label>바탕색 <input type="color" id="me-bg" value="' + theme.bg + '"></label>' +
          '<label><input type="checkbox" id="me-auto" checked> 바탕색 자동</label></div>';
        panel.innerHTML = html + actions(msg);
        panel.querySelectorAll('.dot').forEach(function (d) {
          d.addEventListener('click', function () { theme = PRESETS[+d.getAttribute('data-i')]; applyTheme(theme); draw(); });
        });
        panel.querySelector('#me-ac').addEventListener('input', function (e) {
          var bg = panel.querySelector('#me-auto').checked ? lightBg(e.target.value) : theme.bg;
          theme = { n: '직접 고른 색', ac: e.target.value, bg: bg };
          panel.querySelector('#me-bg').value = bg; applyTheme(theme); refreshActions();
        });
        panel.querySelector('#me-bg').addEventListener('input', function (e) {
          panel.querySelector('#me-auto').checked = false;
          theme = { n: '직접 고른 색', ac: theme.ac, bg: e.target.value }; applyTheme(theme); refreshActions();
        });
      } else {
        var h = '<p>글씨체</p>';
        FONTS.forEach(function (f, i) {
          h += '<button class="font-opt' + (i === fontIdx ? ' on' : '') + '" data-i="' + i + '" style="font-family:' + f.h.replace(/"/g, "'") + '">' + f.n + '</button>';
        });
        panel.innerHTML = h + actions(msg);
        panel.querySelectorAll('.font-opt').forEach(function (b) {
          b.addEventListener('click', function () { fontIdx = +b.getAttribute('data-i'); applyFont(fontIdx); draw(); });
        });
      }
      bindActions();
    }
  }
})();
</script>
